# ---------------------------------------------------------------------------
# Gradle / JVM tuning
# ---------------------------------------------------------------------------
# NOTE: This machine has 4 cores and only ~3 GB of RAM available to the build.
# Heap sizes are deliberately conservative to avoid the OOM-killer during
# Kotlin/KSP compilation. If you move to a larger machine, raising these
# (e.g. -Xmx4g, workers.max=4) will speed builds up considerably.
org.gradle.jvmargs=-Xmx1792m -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1280m

org.gradle.parallel=true
org.gradle.workers.max=2
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# ---------------------------------------------------------------------------
# Android
# ---------------------------------------------------------------------------
android.useAndroidX=true
android.nonTransitiveRClass=true
android.defaults.buildfeatures.buildconfig=false
android.nonFinalResIds=true

# ---------------------------------------------------------------------------
# Kotlin
# ---------------------------------------------------------------------------
kotlin.code.style=official
kotlin.incremental=true
