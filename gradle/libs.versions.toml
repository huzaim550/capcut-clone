# ---------------------------------------------------------------------------
# Reelforge version catalog
#
# These versions are NOT guesses. They are pinned to a set that was verified to
# resolve and to compile on this exact machine (Gradle 9.3.1 + JDK 21 +
# Android SDK 36), cross-checked against the local Gradle module cache and the
# `aar-metadata.properties` shipped inside each Android artifact.
#
# Known constraints, all verified rather than assumed:
#   * compileSdk must stay at 36 -- only android-36 / android-36.1 platforms are
#     installed, and there is no android-37 to compile against.
#   * Compose is held at 1.9.x. Compose 1.12.x pulls a newer AGP + compileSdk 37
#     requirement that this toolchain cannot satisfy.
#   * media3 1.11.1 declares minCompileSdk=36, so it is the newest stable line
#     that works here (1.10+ moved from 35 to 36; we still have headroom).
#   * `material-icons-extended` is deliberately absent: it is no longer
#     published for the Compose 1.9 line. Reelforge ships its own vector
#     drawables in core/designsystem instead.
# ---------------------------------------------------------------------------
[versions]
agp = "8.13.1"
kotlin = "2.2.0"
ksp = "2.2.0-2.0.2"

compileSdk = "36"
minSdk = "26"
targetSdk = "36"

compose = "1.9.3"
material3 = "1.4.0"
activityCompose = "1.10.1"
lifecycle = "2.9.4"
navigation = "2.9.4"
coreKtx = "1.16.0"

room = "2.8.5"
datastore = "1.1.7"
documentfile = "1.1.0"
work = "2.10.5"

media3 = "1.11.1"

serialization = "1.9.0"
coroutines = "1.10.2"

junit = "4.13.2"
robolectric = "4.16"
androidxTestCore = "1.7.0"
androidxTestJunit = "1.2.1"
espresso = "3.6.1"

[libraries]
# --- Core / Kotlin -----------------------------------------------------------
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }

# --- Compose -----------------------------------------------------------------
compose-bom = { module = "androidx.compose:compose-bom", version = "2026.09.00" }
compose-ui = { module = "androidx.compose.ui:ui", version.ref = "compose" }
compose-ui-graphics = { module = "androidx.compose.ui:ui-graphics", version.ref = "compose" }
compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling", version.ref = "compose" }
compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview", version.ref = "compose" }
compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4", version.ref = "compose" }
compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "compose" }
compose-foundation = { module = "androidx.compose.foundation:foundation", version.ref = "compose" }
compose-material3 = { module = "androidx.compose.material3:material3", version.ref = "material3" }

# --- Lifecycle / navigation / activity ---------------------------------------
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }

# --- Persistence -------------------------------------------------------------
room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
room-ktx = { module = "androidx.room:room-ktx", version.ref = "room" }
room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
room-testing = { module = "androidx.room:room-testing", version.ref = "room" }
datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }

# --- Media3 ------------------------------------------------------------------
media3-common = { module = "androidx.media3:media3-common", version.ref = "media3" }
media3-exoplayer = { module = "androidx.media3:media3-exoplayer", version.ref = "media3" }
media3-ui = { module = "androidx.media3:media3-ui", version.ref = "media3" }
media3-transformer = { module = "androidx.media3:media3-transformer", version.ref = "media3" }
media3-effect = { module = "androidx.media3:media3-effect", version.ref = "media3" }

# --- Test --------------------------------------------------------------------
junit = { module = "junit:junit", version.ref = "junit" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-test-core-ktx = { module = "androidx.test:core-ktx", version.ref = "androidxTestCore" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidxTestJunit" }
androidx-espresso-core = { module = "androidx.test.espresso:espresso-core", version.ref = "espresso" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
android-library = { id = "com.android.library", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
